name: 問題回報
description: 安裝、登入、配對或發送異常（勿附憑證）
labels: [bug]
body:
  - type: markdown
    attributes:
      value: 請勿貼 Session、Cookie、Token、PIN、API Key、完整備份或個人聯絡資料。安全漏洞請使用私密安全回報。
  - type: input
    id: version
    attributes:
      label: Add-on 版本
      placeholder: 例如 0.1.2
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Home Assistant／Supervisor 版本與主機架構
      placeholder: 不需提供 IP 或主機名稱
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 重現步驟、預期與實際結果
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: 錯誤名稱與最小必要日誌
      description: 貼上前先檢查並遮蔽帳號與收件者資訊。
  - type: checkboxes
    id: checked
    attributes:
      label: 提交前確認
      options:
        - label: 已移除登入憑證、備份及私人資訊。
          required: true
