name: Test and build
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  gateway:
    name: Test ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - arch: aarch64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: line_oa/app/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: line_oa/app
      - run: npm test
        working-directory: line_oa/app
      - run: python3 scripts/check-backup-policy.py
      - run: python3 scripts/check-publication.py
      - name: Build native image
        env:
          PLATFORM: ${{ matrix.platform }}
          HA_ARCH: ${{ matrix.arch }}
        run: docker build --provenance=false --platform "$PLATFORM" --build-arg "BUILD_ARCH=$HA_ARCH" -t line-oa:test line_oa
      - name: Test native runtime
        env:
          HA_ARCH: ${{ matrix.arch }}
        run: python3 scripts/container-smoke.py --arch "$HA_ARCH"
