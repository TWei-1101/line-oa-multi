name: Publish prebuilt Add-on image
on:
  workflow_dispatch:
    inputs:
      confirm_publish:
        description: Publish tested amd64 and aarch64 images and the combined manifest
        type: boolean
        required: true
        default: false
permissions:
  contents: read
jobs:
  publish:
    name: Publish ${{ matrix.arch }}
    if: inputs.confirm_publish
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - arch: aarch64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: line_oa/app/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: line_oa/app
      - run: npm test
        working-directory: line_oa/app
      - run: python3 scripts/check-backup-policy.py
      - run: python3 scripts/check-publication.py
      - name: Build and test the exact native image
        env:
          REPOSITORY: ${{ github.repository }}
          PLATFORM: ${{ matrix.platform }}
          HA_ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          release_version="$(node -p "require('./line_oa/app/package.json').version")"
          image="ghcr.io/${REPOSITORY,,}:${release_version}-${HA_ARCH}"
          docker build --provenance=false --platform "$PLATFORM" --build-arg "BUILD_VERSION=${release_version}" --build-arg "BUILD_ARCH=${HA_ARCH}" --label "org.opencontainers.image.source=https://github.com/${REPOSITORY}" --label "org.opencontainers.image.revision=${GITHUB_SHA}" -t line-oa:test -t "${image}" line_oa
          python3 scripts/container-smoke.py --arch "$HA_ARCH"
          echo "RELEASE_IMAGE=${image}" >> "$GITHUB_ENV"
      - name: Publish tested architecture image
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          export DOCKER_CONFIG="${RUNNER_TEMP}/line-oa-publish-docker"
          mkdir -m 700 -p "$DOCKER_CONFIG"
          trap 'docker logout ghcr.io >/dev/null 2>&1 || true; rm -rf "$DOCKER_CONFIG"' EXIT
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker push "$RELEASE_IMAGE"
          echo "Published $RELEASE_IMAGE" >> "$GITHUB_STEP_SUMMARY"
  manifest:
    name: Publish combined manifest
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
      - name: Combine tested images
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          export DOCKER_CONFIG="${RUNNER_TEMP}/line-oa-manifest-docker"
          mkdir -m 700 -p "$DOCKER_CONFIG"
          trap 'docker logout ghcr.io >/dev/null 2>&1 || true; rm -rf "$DOCKER_CONFIG"' EXIT
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          release_version="$(python3 -c 'import json; print(json.load(open("line_oa/app/package.json"))["version"])')"
          image="ghcr.io/${REPOSITORY,,}:${release_version}"
          docker manifest create "$image" "${image}-amd64" "${image}-aarch64"
          docker manifest annotate "$image" "${image}-aarch64" --os linux --arch arm64 --variant v8
          docker manifest push "$image"
          docker manifest inspect "$image" > "$RUNNER_TEMP/line-oa-manifest.json"
          python3 -c 'import json,sys; d=json.load(open(sys.argv[1])); assert {(m["platform"]["os"],m["platform"]["architecture"]) for m in d["manifests"]}=={("linux","amd64"),("linux","arm64")}; print("Verified linux/amd64 and linux/arm64 manifest")' "$RUNNER_TEMP/line-oa-manifest.json"
          echo "Published $image (amd64 + aarch64)" >> "$GITHUB_STEP_SUMMARY"
